[package]
name = "vaporstrap"
version = "0.1.0"
description = "Bootstrapper/lanzador open source para Roblox en Linux"
authors = ["Vaporstrap contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/<tu-usuario>/vaporstrap"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vaporstrap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
