app-id: io.github.vaporstrap.app
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20

command: vaporstrap

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network # necesario para descargar/actualizar el motor (Cordial) y checar releases
  - --device=dri # aceleración gráfica (Vulkan/GL)
  - --filesystem=xdg-download
  - --filesystem=~/.var/app/io.github.cordial.app:ro # ejemplo: acceso de lectura al motor si aplica

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
  env:
    CARGO_HOME: /run/build/vaporstrap/cargo

modules:
  - name: vaporstrap
    buildsystem: simple
    build-commands:
      - npm ci --offline || npm ci
      - npm run build
      - cargo build --manifest-path src-tauri/Cargo.toml --release
      - install -Dm755 src-tauri/target/release/vaporstrap /app/bin/vaporstrap
      - install -Dm644 assets/logo.png /app/share/icons/hicolor/512x512/apps/io.github.vaporstrap.app.png
      - install -Dm644 flatpak/io.github.vaporstrap.app.desktop /app/share/applications/io.github.vaporstrap.app.desktop
      - install -Dm644 flatpak/io.github.vaporstrap.app.metainfo.xml /app/share/metainfo/io.github.vaporstrap.app.metainfo.xml
    sources:
      - type: dir
        path: ..
